apiVersion: apps/v1
kind: Deployment
metadata:
  name: validate-deployment
  namespace: validate
  labels:
    app: validate
    env: prod
spec:
  replicas: 6
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  selector:
    matchLabels:
      app: validate
  template:
    metadata:
      labels:
        app: validate
    spec:
      containers:
      - name: validate
        image: registryharbor.bhashini.co.in/bhashini/udyat-prod/validate:1
        ports:
        - containerPort: 5001
        resources:
          limits:
            cpu: "4"
            memory: "4Gi"
          requests:
            cpu: "2"
            memory: "2Gi"
        envFrom:
        - secretRef:
            name: common-secret
        volumeMounts:
        - name: model-dir
          mountPath: /opt

      volumes:
      - name: model-dir
        nfs:
          server: 172.29.128.226
          path: /u01/nfs

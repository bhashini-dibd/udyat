apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataset-download-deployment
  namespace: dataset-download
  labels:
    app: dataset-download
    env: prod
spec:
  replicas: 6
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  selector:
    matchLabels:
      app: dataset-download
  template:
    metadata:
      labels:
        app: dataset-download
    spec:
      # Match these to your NFS export ownership if different
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"

      initContainers:
      - name: prepare-jre
        image: docker.io/eclipse-temurin:11-jre
        imagePullPolicy: IfNotPresent
        # Run init as root to create/chown the overlay dir
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        command: ["/bin/sh","-lc"]
        args:
          - |
            set -e
            mkdir -p /jre
            # Find JRE in this image
            SRC=""
            for C in /opt/java/openjdk /usr/lib/jvm/* /usr/lib/jvm/java-11-openjdk*; do
              if [ -x "$C/bin/java" ]; then SRC="$C"; break; fi
            done
            [ -n "$SRC" ] || { echo "No JRE found in base image"; exit 1; }
            echo "Using JRE at $SRC"
            # Copy without preserving root ownership
            cp -r "$SRC"/. /jre/
            chown -R 1000:1000 /jre
            /jre/bin/java -version
        volumeMounts:
        - name: jre-overlay
          mountPath: /jre   # don't mask the source JRE path

      containers:
      - name: dataset-download
        image: registryharbor.bhashini.co.in/bhashini/udyat-prod/dataset-download:1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "3"
            memory: "3Gi"
          limits:
            cpu: "5"
            memory: "6Gi"
        envFrom:
        - secretRef:
            name: common-secret
        env:
        - name: JAVA_HOME
          value: /opt/java
        - name: PATH
          value: /opt/java/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        volumeMounts:
        - name: model-dir
          mountPath: /opt          # NFS mount required by your app
        - name: jre-overlay
          mountPath: /opt/java     # overlay JRE for runtime

      volumes:
      - name: model-dir
        nfs:
          server: 172.29.128.226
          path: /u01/nfs
          readOnly: false
      - name: jre-overlay
        emptyDir: {}

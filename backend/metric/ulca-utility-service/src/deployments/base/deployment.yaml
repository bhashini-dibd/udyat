apiVersion: apps/v1
kind: Deployment
metadata:
  name: utility-service-deployment
  namespace: utility-service
  labels:
    app: utility-service
    env: prod
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  selector:
    matchLabels:
      app: utility-service
  template:
    metadata:
      labels:
        app: utility-service
    spec:
      containers:
      - name: utility-service
        image: registryharbor.bhashini.co.in/bhashini/udyat-prod/utility-service:1
        ports:
        - containerPort: 5001
        resources:
          limits:
            cpu: "3"
            memory: "3Gi"
          requests:
            cpu: "1"
            memory: "2Gi"
        envFrom:
        - secretRef:
            name: common-secret

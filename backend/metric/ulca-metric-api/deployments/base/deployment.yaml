apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-metric-deployment
  namespace: data-metric
  labels:
    app: data-metric
    env: prod
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  selector:
    matchLabels:
      app: data-metric
  template:
    metadata:
      labels:
        app: data-metric
    spec:
      containers:
      - name: data-metric
        image: registryharbor.bhashini.co.in/bhashini/udyat-prod/data-metric:1
        ports:
        - containerPort: 5001
        resources:
          limits:
            cpu: "3"
            memory: "3Gi"
          requests:
            cpu: "1"
            memory: "2Gi"
        envFrom:
        - secretRef:
            name: common-secret
